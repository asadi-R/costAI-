
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محاسبه بهای تمام‌شده</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f7f3;color:#26372c;font-family:Tahoma}
header{background:#16834b;color:white;text-align:center;padding:25px}
main{max-width:800px;margin:20px auto;padding:0 12px}
.card{background:white;border-radius:14px;padding:18px;margin-bottom:16px}
h2{font-size:17px;color:#16834b}
.grid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #ccdacf;border-radius:8px;font-size:15px;font-family:inherit}
button{padding:12px;border:0;border-radius:8px;font-family:inherit;cursor:pointer}
.save{background:#16834b;color:white;width:100%;margin-top:16px}
.edit{background:#e5f3e9;color:#167744}
.del{background:#ffeded;color:#b33}
.stat{background:#eff7f1;padding:13px;border-radius:9px}
.stat small{display:block;font-size:12px;margin-bottom:8px}
.stat strong{color:#16834b;overflow-wrap:anywhere}
.item{border:1px solid #ddd;border-radius:10px;padding:13px;margin-top:12px}
.item p{font-size:13px;line-height:1.8}
.actions{display:flex;gap:8px}
.actions button{flex:1}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>محاسبه بهای تمام‌شده</h1>
<p>مدیریت هزینه و محاسبه بهای تولید</p>
</header>
<main>
<section class="card">
<h2 id="formTitle">ثبت محصول جدید</h2>
<form id="form">
<label>نام محصول</label>
<input id="name" required placeholder="نام محصول">
<div class="grid">
<div><label>هزینه مواد اولیه (ریال)</label><input id="materials" class="num" inputmode="numeric" required></div>
<div><label>دستمزد مستقیم (ریال)</label><input id="labor" class="num" inputmode="numeric" required></div>
<div><label>هزینه سربار (ریال)</label><input id="overhead" class="num" inputmode="numeric" required></div>
<div><label>تعداد محصول سالم</label><input id="quantity" class="num" inputmode="numeric" required></div>
</div>
<button class="save" id="submit" type="submit">ثبت و محاسبه</button>
<button class="edit" id="cancel" type="button" hidden>لغو ویرایش</button>
</form>
</section>
<section class="card">
<h2>خلاصه گزارش</h2>
<div class="stats">
<div class="stat"><small>تعداد محصولات</small><strong id="count">۰</strong></div>
<div class="stat"><small>مجموع تعداد سالم</small><strong id="qty">۰</strong></div>
<div class="stat"><small>مجموع هزینه تولید (ریال)</small><strong id="cost">۰</strong></div>
<div class="stat"><small>میانگین بهای واحد (ریال)</small><strong id="average">۰</strong></div>
</div>
</section>
<section class="card">
<h2>سوابق محصولات</h2>
<div id="history">هنوز محصولی ثبت نشده است.</div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=new Intl.NumberFormat('fa-IR');
const key='costai_products';
let products=[];
let editing=null;

function eng(v){
 return String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
 .replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function val(v){
 return Number(eng(v).replace(/[^\d]/g,''))||0;
}
function num(v){return fmt.format(Math.round(v||0));}

document.querySelectorAll('.num').forEach(el=>{
 el.addEventListener('input',()=>{
  let v=eng(el.value).replace(/[^\d]/g,'');
  el.value=v?num(Number(v)):'';
 });
});

function store(){
 localStorage.setItem(key,JSON.stringify(products));
}

function render(){
 $('count').textContent=num(products.length);
 let q=products.reduce((s,p)=>s+p.quantity,0);
 let c=products.reduce((s,p)=>s+p.total,0);
 $('qty').textContent=num(q);
 $('cost').textContent=num(c);
 $('average').textContent=num(q?c/q:0);
 $('history').innerHTML='';

 if(!products.length){
  $('history').textContent='هنوز محصولی ثبت نشده است.';
  return;
 }

 products.forEach(p=>{
  let box=document.createElement('div');
  box.className='item';
  let h=document.createElement('h3');
  h.textContent=p.name;
  box.append(h);

  [
   ['مواد اولیه',p.materials],
   ['دستمزد مستقیم',p.labor],
   ['سربار',p.overhead],
   ['تعداد سالم',p.quantity],
   ['مجموع هزینه (ریال)',p.total],
   ['بهای هر واحد (ریال)',p.quantity?p.total/p.quantity:0]
  ].forEach(([label,value])=>{
   let row=document.createElement('p');
   row.textContent=label+' : '+num(value);
   box.append(row);
  });

  let actions=document.createElement('div');
  actions.className='actions';
  let e=document.createElement('button');
  e.className='edit';
  e.textContent='ویرایش';
  e.onclick=()=>edit(p.id);
  let d=document.createElement('button');
  d.className='del';
  d.textContent='حذف';
  d.onclick=()=>remove(p.id);
  actions.append(e,d);
  box.append(actions);
  $('history').append(box);
 });
}

$('form').addEventListener('submit',e=>{
 e.preventDefault();
 let name=$('name').value.trim();
 let materials=val($('materials').value);
 let labor=val($('labor').value);
 let overhead=val($('overhead').value);
 let quantity=val($('quantity').value);
 if(!name||quantity<1){
  alert('نام محصول و تعداد سالم معتبر وارد کنید.');
  return;
 }
 let p={
  id:editing||Date.now(),
  name,materials,labor,overhead,quantity,
  total:materials+labor+overhead
 };
 if(editing){
  products=products.map(x=>x.id===editing?p:x);
 }else{
  products.unshift(p);
 }
 store();
 reset();
 render();
});

function edit(id){
 let p=products.find(x=>x.id===id);
 if(!p)return;
 editing=id;
 $('name').value=p.name;
 $('materials').value=num(p.materials);
 $('labor').value=num(p.labor);
 $('overhead').value=num(p.overhead);
 $('quantity').value=num(p.quantity);
 $('formTitle').textContent='ویرایش محصول';
 $('submit').textContent='ذخیره تغییرات';
 $('cancel').hidden=false;
 window.scrollTo({top:0,behavior:'smooth'});
}

function remove(id){
 if(!confirm('این محصول حذف شود؟'))return;
 products=products.filter(p=>p.id!==id);
 store();
 render();
}

function reset(){
 editing=null;
 $('form').reset();
 $('formTitle').textContent='ثبت محصول جدید';
 $('submit').textContent='ثبت و محاسبه';
 $('cancel').hidden=true;
}
$('cancel').onclick=reset;

try{
 products=JSON.parse(localStorage.getItem(key)||'[]');
 if(!Array.isArray(products))products=[];
}catch(e){products=[];}
render();
</script>
</body>
</html>
