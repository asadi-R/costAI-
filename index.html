
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CostAI | مدیریت بهای تمام‌شده</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f4;color:#193326;font-family:Tahoma,Arial,sans-serif}
header{background:#147d55;color:white;padding:25px 18px;border-radius:0 0 22px 22px}
header h1{margin:0;font-size:27px}
header p{font-size:13px}
main{max-width:650px;margin:auto;padding:15px}
.card{background:white;border-radius:16px;padding:17px;margin-bottom:15px;box-shadow:0 3px 12px #00000009}
h2{font-size:18px;margin:0 0 14px}
label{display:block;font-size:13px;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #d5e1d9;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:bold;cursor:pointer}
.primary{background:#147d55;color:white;width:100%;margin-top:14px}
.secondary{background:#e6f4eb;color:#147d55}
.danger{background:#fff0ef;color:#b42318}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#e8f5ed;padding:13px;border-radius:12px}
.stat small{display:block;color:#587264;font-size:12px}
.stat strong{display:block;margin-top:8px;font-size:16px}
.item{border-top:1px solid #e5ece7;padding:13px 0}
.item h3{font-size:15px;margin:0 0 8px}
.muted{font-size:12px;color:#718078;line-height:2}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
.msg{font-size:13px;line-height:1.8;margin-top:10px;color:#147d55}
.error{color:#b42318}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h1>CostAI</h1>
<p>محاسبه هوشمند بهای تمام‌شده محصولات تولیدی</p>
</header>
<main>
<section class="card" id="auth">
<h2>ورود به حساب کاربری</h2>
<label>ایمیل</label>
<input id="email" type="email" placeholder="ایمیل شما">
<label>رمز عبور</label>
<input id="password" type="password" placeholder="رمز عبور">
<div class="grid">
<button class="primary" id="login">ورود</button>
<button class="secondary" id="signup">ثبت‌نام</button>
</div>
<div id="authmsg" class="msg"></div>
</section>

<section id="app" class="hidden">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2>ثبت محصول</h2>
<button class="secondary" id="logout">خروج</button>
</div>
<label>نام محصول</label>
<input id="name" placeholder="مثلاً میز چوبی">
<label>هزینه مواد اولیه (ریال)</label>
<input id="material" type="number" min="0" inputmode="decimal" placeholder="۰">
<label>دستمزد مستقیم (ریال)</label>
<input id="labor" type="number" min="0" inputmode="decimal" placeholder="۰">
<label>هزینه سربار (ریال)</label>
<input id="overhead" type="number" min="0" inputmode="decimal" placeholder="۰">
<label>تعداد محصول سالم</label>
<input id="quantity" type="number" min="1" step="1" inputmode="numeric" placeholder="مثلاً ۱۰">
<button class="primary" id="save">ذخیره محصول</button>
<button class="secondary hidden" id="cancel" style="width:100%;margin-top:8px">لغو ویرایش</button>
<div id="formmsg" class="msg"></div>
</div>

<div class="card">
<h2>خلاصه هزینه‌ها</h2>
<div class="grid">
<div class="stat"><small>مجموع هزینه‌ها</small><strong id="total">۰ ریال</strong></div>
<div class="stat"><small>تعداد محصولات</small><strong id="count">۰</strong></div>
</div>
</div>

<div class="card">
<h2>سوابق محصولات</h2>
<div id="history" class="muted">در حال دریافت اطلاعات...</div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://cpkbspgyvqwkbmqaxosa.supabase.co";
const SUPABASE_KEY="sb_publishable_nGMN4lVZqEqDprJUc6OAgg_wxGelI_F";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser=null;
let editingId=null;
const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString("fa-IR")+" ریال";

function message(id,text,error=false){
  $(id).textContent=text;
  $(id).className=error?"msg error":"msg";
}

async function loadProducts(){
  const {data,error}=await db.from("products")
    .select("*").order("created_at",{ascending:false});
  if(error){message("formmsg","خطا در دریافت اطلاعات: "+error.message,true);return;}
  const list=data||[];
  $("count").textContent=list.length.toLocaleString("fa-IR");
  $("total").textContent=money(list.reduce((s,p)=>s+Number(p.material_cost)+Number(p.labor_cost)+Number(p.overhead_cost),0));
  if(!list.length){
    $("history").textContent="هنوز محصولی ثبت نشده است.";
    return;
  }
  $("history").innerHTML="";
  list.forEach(p=>{
    const total=Number(p.material_cost)+Number(p.labor_cost)+Number(p.overhead_cost);
    const unit=total/Number(p.good_quantity);
    const div=document.createElement("div");
    div.className="item";
    const title=document.createElement("h3");
    title.textContent=p.name;
    const details=document.createElement("div");
    details.className="muted";
    details.textContent=
      "مواد اولیه: "+money(p.material_cost)+" | دستمزد: "+money(p.labor_cost)+
      "\nسربار: "+money(p.overhead_cost)+" | تعداد سالم: "+
      Number(p.good_quantity).toLocaleString("fa-IR");
    const result=document.createElement("div");
    result.className="msg";
    result.textContent="مجموع: "+money(total)+" | بهای هر واحد: "+money(unit);
    const actions=document.createElement("div");
    actions.className="actions";
    const edit=document.createElement("button");
    edit.className="secondary";
    edit.textContent="ویرایش";
    edit.onclick=()=>startEdit(p);
    const del=document.createElement("button");
    del.className="danger";
    del.textContent="حذف";
    del.onclick=()=>deleteProduct(p.id);
    actions.append(edit,del);
    div.append(title,details,result,actions);
    $("history").append(div);
  });
}

function startEdit(p){
  editingId=p.id;
  $("name").value=p.name;
  $("material").value=p.material_cost;
  $("labor").value=p.labor_cost;
  $("overhead").value=p.overhead_cost;
  $("quantity").value=p.good_quantity;
  $("save").textContent="ذخیره تغییرات";
  $("cancel").classList.remove("hidden");
  message("formmsg","در حال ویرایش محصول");
  window.scrollTo({top:0,behavior:"smooth"});
}

function resetForm(){
  editingId=null;
  ["name","material","labor","overhead","quantity"].forEach(id=>$(id).value="");
  $("save").textContent="ذخیره محصول";
  $("cancel").classList.add("hidden");
  message("formmsg","");
}
$("cancel").onclick=resetForm;

$("save").onclick=async()=>{
  const name=$("name").value.trim();
  const material=Number($("material").value);
  const labor=Number($("labor").value);
  const overhead=Number($("overhead").value);
  const quantity=Number($("quantity").value);
  if(!name){message("formmsg","نام محصول را وارد کن.",true);return;}
  if([material,labor,overhead].some(x=>!Number.isFinite(x)||x<0)){
    message("formmsg","هزینه‌ها باید عدد صفر یا بیشتر باشند.",true);return;
  }
  if(!Number.isInteger(quantity)||quantity<1){
    message("formmsg","تعداد محصول سالم باید حداقل ۱ باشد.",true);return;
  }
  const record={
    name,material_cost:material,labor_cost:labor,
    overhead_cost:overhead,good_quantity:quantity
  };
  $("save").disabled=true;
  const result=editingId
    ? await db.from("products").update(record).eq("id",editingId)
    : await db.from("products").insert({...record,user_id:currentUser.id});
  $("save").disabled=false;
  if(result.error){message("formmsg","خطا: "+result.error.message,true);return;}
  resetForm();
  message("formmsg","محصول با موفقیت ذخیره شد.");
  await loadProducts();
};

async function deleteProduct(id){
  if(!confirm("این محصول حذف شود؟"))return;
  const {error}=await db.from("products").delete().eq("id",id);
  if(error){message("formmsg","خطا در حذف: "+error.message,true);return;}
  await loadProducts();
}

async function showSession(){
  const {data}=await db.auth.getSession();
  currentUser=data.session?.user||null;
  $("auth").classList.toggle("hidden",!!currentUser);
  $("app").classList.toggle("hidden",!currentUser);
  if(currentUser)await loadProducts();
}

$("signup").onclick=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  if(!email||password.length<6){message("authmsg","ایمیل و رمز عبور حداقل ۶ کاراکتری وارد کن.",true);return;}
  const {data,error}=await db.auth.signUp({email,password});
  if(error){message("authmsg",error.message,true);return;}
  if(data.session){message("authmsg","ثبت‌نام انجام شد.");await showSession();}
  else message("authmsg","ثبت‌نام انجام شد. ایمیلت را برای تأیید حساب بررسی کن.");
};

$("login").onclick=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  const {error}=await db.auth.signInWithPassword({email,password});
  if(error){message("authmsg",error.message,true);return;}
  await showSession();
};

$("logout").onclick=async()=>{
  await db.auth.signOut();
  resetForm();
  await showSession();
};

db.auth.onAuthStateChange(()=>setTimeout(showSession,0));
showSession();
</script>
</body>
</html>
